<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650">
    <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8f8ff"/>
            <stop offset="0.45" stop-color="#78b9e8"/>
            <stop offset="1" stop-color="#172d52"/>
        </linearGradient>

        <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00e5ff"/>
            <stop offset="1" stop-color="#0875ff"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <ellipse cx="250" cy="610" rx="135" ry="20" fill="#008cff" opacity=".25" filter="url(#glow)"/>

    <path d="M180 475 L145 575 Q142 590 158 592 L210 592 L225 480Z"
          fill="url(#metal)" stroke="#49baff" stroke-width="4"/>
    <path d="M320 475 L355 575 Q358 590 342 592 L290 592 L275 480Z"
          fill="url(#metal)" stroke="#49baff" stroke-width="4"/>

    <path d="M180 250 L95 330 Q85 342 100 355 L130 375 L215 290Z"
          fill="url(#metal)" stroke="#49baff" stroke-width="4"/>
    <path d="M320 250 L405 330 Q415 342 400 355 L370 375 L285 290Z"
          fill="url(#metal)" stroke="#49baff" stroke-width="4"/>

    <rect x="150" y="205" width="200" height="290" rx="70"
          fill="url(#metal)" stroke="#5bc8ff" stroke-width="5"/>

    <rect x="175" y="250" width="150" height="95" rx="35"
          fill="#061528" stroke="#1bbcff" stroke-width="4"/>

    <ellipse cx="220" cy="295" rx="14" ry="20" fill="#00e5ff" filter="url(#glow)"/>
    <ellipse cx="280" cy="295" rx="14" ry="20" fill="#00e5ff" filter="url(#glow)"/>

    <path d="M215 325 Q250 350 285 325"
          fill="none" stroke="#00d9ff" stroke-width="5" stroke-linecap="round"/>

    <rect x="205" y="375" width="90" height="70" rx="18"
          fill="#0a2340" stroke="#36bfff" stroke-width="3"/>
    <circle cx="250" cy="410" r="17" fill="url(#blue)" filter="url(#glow)"/>

    <path d="M250 205 V165" stroke="#48caff" stroke-width="5"/>
    <circle cx="250" cy="150" r="14" fill="#00e5ff" filter="url(#glow)"/>

    <circle cx="112" cy="350" r="16" fill="#0b2e55" stroke="#36bfff" stroke-width="4"/>
    <circle cx="388" cy="350" r="16" fill="#0b2e55" stroke="#36bfff" stroke-width="4"/>

    <path d="M185 500 H315" stroke="#00d9ff" stroke-width="4" opacity=".8"/>
</svg>
